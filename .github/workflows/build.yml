name: Build and Push to GHCR

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          IMAGE_ID=$(echo "ghcr.io/${{ github.repository }}/music-migrater-backend" | tr '[:upper:]' '[:lower:]')
          docker build -f Backend/MusicMigrater/Dockerfile -t $IMAGE_ID:latest Backend/
          docker push $IMAGE_ID:latest
